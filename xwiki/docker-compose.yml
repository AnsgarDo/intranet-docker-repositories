services:

  web:
    build:
      context: ..
      dockerfile: xwiki/Dockerfile

    init: true

    depends_on:
      - db

    ports:
      - "8080:8080"

    environment:
      XWIKI_VERSION: ${XWIKI_VERSION:-18.7.0}
      DB_USER: ${DB_USER:-xwiki}
      DB_PASSWORD: ${DB_PASSWORD:-xwiki}
      DB_DATABASE: ${DB_DATABASE:-xwiki}
      DB_HOST: db

    volumes:
      - xwiki-data:/usr/local/xwiki

    networks:
      - bridge


  db:
    image: mariadb:latest

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-xwiki}
      MYSQL_USER: ${DB_USER:-xwiki}
      MYSQL_PASSWORD: ${DB_PASSWORD:-xwiki}
      MYSQL_DATABASE: ${DB_DATABASE:-xwiki}

    volumes:
      - mariadb-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_bin"
      - "--explicit-defaults-for-timestamp=1"

    networks:
      - bridge


networks:
  bridge:
    driver: bridge


volumes:
  mariadb-data:
  xwiki-data: