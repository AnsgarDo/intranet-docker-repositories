services:
    db:
        image: mariadb:11
        restart: unless-stopped
        command:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
        environment:
            MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
            MARIADB_DATABASE: ${DB_DATABASE:-bookstack}
            MARIADB_USER: ${DB_USERNAME:-bookstack}
            MARIADB_PASSWORD: ${DB_PASSWORD}
        volumes:
            - bookstack-db-data:/var/lib/mysql
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "mariadb-admin ping -h 127.0.0.1 -u root -p${MARIADB_ROOT_PASSWORD} --silent",
                ]
            interval: 5s
            timeout: 5s
            retries: 30

    bookstack:
        # Community-Image, keine eigene Dockerfile noetig
        image: solidnerd/bookstack:26.9.2
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
        ports:
            - "8082:8080"
        environment:
            # Basis-URL ohne abschliessenden Slash, inkl. Port
            APP_URL: ${APP_URL:-http://localhost:8082}
            # 32 Zeichen, dauerhaft beibehalten (sonst sind Daten nicht mehr entschluesselbar)
            APP_KEY: ${APP_KEY}
            DB_HOST: db:3306
            DB_DATABASE: ${DB_DATABASE:-bookstack}
            DB_USERNAME: ${DB_USERNAME:-bookstack}
            DB_PASSWORD: ${DB_PASSWORD}
        volumes:
            - bookstack-uploads:/var/www/bookstack/public/uploads
            - bookstack-storage-uploads:/var/www/bookstack/storage/uploads

volumes:
    bookstack-db-data:
    bookstack-uploads:
    bookstack-storage-uploads:
